name: Build Mobile Legacy

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - toggles.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check trigger
        id: trigger
        shell: bash
        run: |
          set -e
          status=$(jq -r '.status // "off"' toggles.json)

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "on" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No build trigger requested."
          fi

      - name: Get latest renderer release
        if: steps.trigger.outputs.enabled == 'true'
        id: renderer
        shell: bash
        run: |
          set -e

          latest_tag=$(curl -fsSL             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Coolguyhehe2515/Mobile-legacy/releases/latest"             | jq -r '.tag_name')

          test -n "$latest_tag"
          test "$latest_tag" != "null"

          current_tag=$(tr -d '[:space:]' < hook.txt || true)

          echo "Current hook: $current_tag"
          echo "Latest renderer release: $latest_tag"

          echo "release_tag=$latest_tag" >> "$GITHUB_OUTPUT"

          if [ "$latest_tag" != "$current_tag" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update hook.txt
        if: steps.trigger.outputs.enabled == 'true' && steps.renderer.outputs.changed == 'true'
        shell: bash
        run: |
          set -e
          printf '%s\n' "${{ steps.renderer.outputs.release_tag }}" > hook.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hook.txt
          git commit -m "Update renderer hook to ${{ steps.renderer.outputs.release_tag }}"
          git push

      - name: Reset Actions toggle
        if: steps.trigger.outputs.enabled == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -e
          jq '.status = "off"' toggles.json > toggles.json.tmp
          mv toggles.json.tmp toggles.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toggles.json
          git commit -m "Reset Actions toggle to off" || true
          git push || true

      - name: Set up JDK
        if: steps.trigger.outputs.enabled == 'true' && (steps.renderer.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        if: steps.trigger.outputs.enabled == 'true' && (steps.renderer.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        shell: bash

      - name: Download renderer binaries
        if: steps.trigger.outputs.enabled == 'true' && (steps.renderer.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          RELEASE_TAG: ${{ steps.renderer.outputs.release_tag }}
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86
          mkdir -p app/src/main/jniLibs/x86_64

          base="https://github.com/Coolguyhehe2515/Mobile-legacy/releases/download/$RELEASE_TAG"
          curl -fL "$base/libmobileglues_arm64.so" -o app/src/main/jniLibs/arm64-v8a/libmobileglues.so
          curl -fL "$base/libmobileglues_arm32.so" -o app/src/main/jniLibs/armeabi-v7a/libmobileglues.so
          curl -fL "$base/libmobileglues_x86.so" -o app/src/main/jniLibs/x86/libmobileglues.so
          curl -fL "$base/libmobileglues_x86_64.so" -o app/src/main/jniLibs/x86_64/libmobileglues.so
        shell: bash

      - name: Set up Gradle
        if: steps.trigger.outputs.enabled == 'true' && (steps.renderer.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        if: steps.trigger.outputs.enabled == 'true' && (steps.renderer.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        if: steps.trigger.outputs.enabled == 'true' && (steps.renderer.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Legacy
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
